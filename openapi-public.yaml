      description: Requested minimum free space after the template's build steps,
        in MiB. Omit to use the team's default. Set to 0 to request no minimum free-disk
        growth. The filesystem is never shrunk, including inherited or already-larger
        filesystems. Growth is best effort, so filesystem metadata can leave the available
        space slightly below the requested minimum.
    EnvdVersion:
      type: string
      description: Version of the envd running in the sandbox
    SandboxMetadata:
      additionalProperties:
