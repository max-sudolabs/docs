name: Check Open Graph images

on:
  pull_request:
    paths:
      - "**/*.mdx"
      - "docs.json"
      - "images/og/opengraph-image.png"
      - "images/og/sdk-reference.png"
      - "images/og/generated/**"
      - "og-generator/**"
      - ".github/workflows/og-images.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - name: Install dependencies
        working-directory: og-generator
        run: pnpm install --frozen-lockfile

      - name: Test generator
        working-directory: og-generator
        run: pnpm test

      - name: Check generated images
        working-directory: og-generator
        run: pnpm check
