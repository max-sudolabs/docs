name: OpenAPI reference tests

on:
  pull_request:
    paths:
      - 'scripts/generate_openapi_reference.py'
      - 'scripts/openapi_*.py'
      - 'scripts/tests/**'
      - 'scripts/requirements-openapi-test.txt'
      - 'openapi-public.yaml'
      - '.github/workflows/openapi-reference-test.yml'
      - '.github/workflows/api-reference-validation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_openapi_reference.py'
      - 'scripts/openapi_*.py'
      - 'scripts/tests/**'
      - 'openapi-public.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements-openapi-test.txt
      - run: python -m unittest discover -s scripts/tests -v
