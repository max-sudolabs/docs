                  message:
                    type: string
                    description: Error
                type: object
              examples:
                volumeConversionFailed:
                  summary: Resolving requested volume mounts fails
                  value:
                    code: 500
                    message: failed to convert volume mounts
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                required:
