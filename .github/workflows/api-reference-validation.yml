name: API Reference Validation

on:
  schedule:
    # Every Thursday at 8 PM UTC
    - cron: '0 20 * * 4'
  workflow_dispatch:

concurrency:
  group: api-reference-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      # The default GITHUB_TOKEN is not allowed to open pull requests, so we use
      # the same GitHub App credentials as the SDK reference sync workflow.
      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTOFIXER_APP_ID }}
          private-key: ${{ secrets.AUTOFIXER_APP_SECRET }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements-openapi-test.txt

      # Generate the spec straight into openapi-public.yaml; the create-pull-request
      # action below detects drift and only opens a PR when the file changes.
      - name: Generate OpenAPI spec
        run: python3 scripts/generate_openapi_reference.py --output openapi-public.yaml

      - name: Validate generated response contracts
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Create or update PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/api-reference-update
          delete-branch: true
          add-paths: openapi-public.yaml
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          commit-message: "docs: update openapi-public.yaml from source specs"
          title: "docs: update API reference spec"
          body: |
            ## OpenAPI Spec Update

            The generated `openapi-public.yaml` has drifted from the source specs.
            This PR updates it to match the latest upstream definitions.

            - Workflow: `${{ github.workflow }}`
            - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Summary
        if: always()
        env:
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          echo "## API Reference Spec Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Result | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| PR operation | ${PR_OPERATION:-No changes} |" >> $GITHUB_STEP_SUMMARY
          if [[ -n "$PR_URL" ]]; then
            echo "| Pull request | $PR_URL |" >> $GITHUB_STEP_SUMMARY
          fi
