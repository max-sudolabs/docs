                  message:
                    type: string
                    description: Error
                type: object
              examples:
                capacityUnavailable:
                  summary: No node has capacity for the requested sandbox
                  value:
                    code: 503
                    message: 'Failed to place sandbox: not enough capacity for the
                      requested resources right now, please retry shortly'
                    error_code: sandbox_capacity_unavailable
        '504':
          description: Backend timeout
