name: Generate Open Graph images

on:
  pull_request:
    paths:
      - "**/*.mdx"
      - "docs.json"
      - "images/og/changelog.png"
      - "images/og/opengraph-image.png"
      - "images/og/sdk-reference.png"
      - "images/og/generated/**"
      - "og-generator/**"
      - ".github/workflows/og-images.yml"

permissions:
  contents: read

concurrency:
  group: og-images-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AUTOFIXER_APP_ID }}
          private-key: ${{ secrets.AUTOFIXER_APP_SECRET }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - name: Install dependencies
        working-directory: og-generator
        run: pnpm install --frozen-lockfile

      - name: Test generator
        working-directory: og-generator
        run: pnpm test

      - name: Generate images
        working-directory: og-generator
        run: pnpm generate

      - name: Check generated images
        working-directory: og-generator
        run: pnpm check

      - name: Commit generated images
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Open Graph images are up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "docs: generate Open Graph images"
          git push origin "HEAD:${HEAD_REF}"
