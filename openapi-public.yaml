      - durationMs
      - requestBody
      - requestHeaders
      - requestUrl
      - errorClass
      - timestamp
      properties:
        id:
          type: string
          format: uuid
          description: Delivery attempt identifier
        teamId:
          type: string
          format: uuid
          description: Team identifier
        webhookId:
          type: string
          format: uuid
          description: Webhook configuration identifier
        eventId:
          type: string
          format: uuid
          description: Sandbox event identifier
        sandboxId:
          type: string
          description: Sandbox identifier
        eventType:
          type: string
          description: Sandbox event type
        status:
          type: string
          enum:
          - success
          - failed
          description: Delivery attempt status
        durationMs:
          type: integer
          format: int32
          description: Delivery request duration in milliseconds
        requestBody:
          type: string
          description: Serialized webhook request body
        requestHeaders:
          type: string
          description: JSON-encoded request headers with sensitive values redacted
        requestUrl:
          type: string
          format: uri
          description: URL attempted for this delivery
        responseBody:
          type:
          - string
          - 'null'
          description: Truncated response body, if a response was received
        responseHeaders:
          type:
          - string
          - 'null'
          description: JSON-encoded response headers, if a response was received
        responseHttpStatusCode:
          type:
          - integer
          - 'null'
          format: int32
          description: HTTP response status code, if a response was received
        errorClass:
          type:
          - string
          - 'null'
          enum:
          - http_error
          - dns_error
          - timeout
          - transport_error
          - request_error
          - signature_error
          - canceled
          description: Machine-readable non-HTTP or HTTP failure class
        errorMessage:
          type:
          - string
          - 'null'
          description: Error message for failures without a useful response body
        timestamp:
          type: string
          format: date-time
          description: Time when the delivery attempt started
      type: object
    WebhookDeliveryStats:
      description: Webhook delivery aggregate stats
      required:
      - buckets
      - total
      - failed
      - durationMs
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryStatsBucket'
        total:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        durationMs:
          $ref: '#/components/schemas/WebhookDeliveryDurationStats'
      type: object
    WebhookDeliveryDurationStats:
      description: Webhook delivery duration statistics in milliseconds
      required:
      - minimum
      - average
      - maximum
      properties:
        minimum:
          type: number
          format: double
        average:
          type: number
          format: double
        maximum:
          type: number
          format: double
      type: object
    WebhookDeliveryStatsBucket:
      description: Webhook delivery stats for a time bucket
      required:
      - timestamp
      - total
      - failed
      - durationMs
      properties:
        timestamp:
          type: string
          format: date-time
        total:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        durationMs:
          $ref: '#/components/schemas/WebhookDeliveryDurationStats'
      type: object
    WebhookDeliveryGroup:
      description: Webhook delivery attempts grouped by sandbox event
      required:
      - eventId
      - eventType
      - sandboxId
      - attempts
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        sandboxId:
          type: string
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
      type: object
    WebhookDeliveriesListPayload:
      description: Paginated webhook delivery attempts grouped by event
      required:
      - data
      - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryGroup'
        nextCursor:
          type:
          - string
          - 'null'
          description: Cursor to pass to the next list request, or null when there
            is no next page.
      type: object
    EnvdHTTPError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
        message:
          type: string
      description: HTTP error from envd, with a numeric status code. Distinct from
        a Connect RPC error.
    ConnectRPCError:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          description: Connect error code, such as not_found or invalid_argument.
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              value:
                type: string
                format: byte
              debug: {}
      description: Connect JSON error. The code is a string, unlike envd's numeric
        HTTP errors.
    ConnectEndStreamResponse:
      type: object
      description: Decoded JSON payload of the final Connect frame (flags byte 2).
        An absent error indicates successful completion.
      properties:
        error:
          $ref: '#/components/schemas/ConnectRPCError'
        metadata:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    SandboxRoutingError:
      type: object
      required:
      - sandboxId
      - message
      - code
      properties:
        sandboxId:
          type: string
        message:
          type: string
        code:
          type: integer
  headers:
    XNextToken:
      description: Cursor to fetch the next page of results, if more exist
      schema:
        type: string
    XTotalRunning:
      description: 'Number of running sandboxes matching the filters, before pagination
        is applied. Only present when running sandboxes were requested.

        '
      schema:
        type: integer
        format: int32
tags:
- name: Sandboxes
- name: Templates
- name: Tags
- name: Volumes
- name: Envd
- name: Filesystem
- name: Process
- name: Teams
- name: Secrets
- name: Events
- name: Webhooks
security: []
